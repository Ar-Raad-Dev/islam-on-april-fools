<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Islamic Ruling on April Fools' Day</title>
    <style>
        /* The Initial "Bait" Styling */
        body {
            margin: 0;
            padding: 0;
            font-family: 'Times New Roman', serif;
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        #bait-container {
            text-align: center;
            padding: 20px;
            background: white;
            border-top: 5px solid #2c5e2e; /* Islamic Green */
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            max-width: 90%;
        }

        .loading-bar {
            width: 100%;
            height: 10px;
            background: #eee;
            margin-top: 20px;
            position: relative;
        }

        .progress {
            width: 0%;
            height: 100%;
            background: #2c5e2e;
            animation: load 3s forwards;
        }

        @keyframes load {
            to { width: 100%; }
        }

        /* The "I FOOLED YOU" Animation Styling */
        #prank-container {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #ff0055;
            z-index: 999;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            animation: bg-flash 0.2s infinite;
        }

        .shifa-text {
            font-size: 5rem;
            font-weight: 900;
            color: yellow;
            text-shadow: 5px 5px 0px black;
            text-align: center;
            font-family: 'Arial Black', sans-serif;
            animation: bounce 0.5s infinite alternate, shake 0.1s infinite;
        }

        .sub-text {
            font-size: 2rem;
            color: white;
            margin-top: 20px;
            font-family: sans-serif;
        }

        @keyframes bg-flash {
            0% { background: #ff0055; }
            50% { background: #00ccff; }
            100% { background: #77ff00; }
        }

        @keyframes bounce {
            from { transform: scale(1); }
            to { transform: scale(1.3); }
        }

        @keyframes shake {
            0% { margin-left: 0rem; }
            25% { margin-left: 0.5rem; }
            75% { margin-left: -0.5rem; }
            100% { margin-left: 0rem; }
        }
    </style>
</head>
<body>

    <div id="bait-container">
        <h2 style="color: #2c5e2e;">Religious Guidance: The History of April 1st</h2>
        <p>Please wait while we verify the authenticity of the text and citations...</p>
        <div class="loading-bar">
            <div class="progress"></div>
        </div>
    </div>

    <div id="prank-container">
        <div class="shifa-text">I FOOLED YOU SHIFA! 🤡</div>
        <div class="sub-text">HAPPY APRIL FOOLS! 🤣</div>
        <div style="font-size: 50px; margin-top: 20px;">😜🏃‍♂️💨</div>
    </div>

    <script>
        // Switch from Bait to Prank after 3 seconds
        setTimeout(() => {
            document.getElementById('bait-container').style.display = 'none';
            document.getElementById('prank-container').style.display = 'flex';
            
            // Optional: Play a "Gotcha" sound if you have one
            // let audio = new Audio('pop.mp3');
            // audio.play();
        }, 3000);
    </script>

</body>
</html>
